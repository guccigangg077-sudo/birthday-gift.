<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff6ec7,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
max-width:500px;
animation:fade 2s;
}

h1{
color:#ff4f81;
font-size:42px;
margin-bottom:15px;
}

p{
font-size:18px;
color:#555;
margin-bottom:25px;
line-height:1.6;
}

button{
background:#ff4f81;
color:white;
border:none;
padding:15px 35px;
border-radius:50px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#ff1f64;
transform:scale(1.08);
}

#gift{
display:none;
margin-top:30px;
animation:pop .8s;
}

#gift img{
width:220px;
border-radius:15px;
}

#gift h2{
margin-top:15px;
color:#ff4f81;
}

@keyframes fade{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}

@keyframes pop{
from{transform:scale(.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}
</style>

</head>
<body>

<div class="card">
<h1>🎉 Happy Birthday! 🎂</h1>

<p>
May your day be filled with happiness, love, laughter, and unforgettable memories.
You deserve every beautiful thing in this world.
Have the most amazing birthday ever! ❤️
</p>

<button onclick="openGift()">🎁 Open Your Gift</button>

<div id="gift">
<img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600" alt="Birthday Cake">
<h2>💖 You Are Amazing! 💖</h2>
<p>I hope all your dreams come true. Happy Birthday! 🎈</p>
</div>

</div>

<script>
function openGift(){
document.getElementById("gift").style.display="block";
}
</script>

</body>
</html>
